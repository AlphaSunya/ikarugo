<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; }
html,body { background:transparent; overflow:hidden; }
canvas { position:absolute; top:0; left:0; }
</style>
</head><body>
<canvas id="c"></canvas>
<script>
const { ipcRenderer } = require('electron');
const c = document.getElementById('c');
const cx = c.getContext('2d');
c.width = window.screen.width;
c.height = window.screen.height;
c.style.width = c.width + 'px';
c.style.height = c.height + 'px';

const FRAME_MS = 1000 / 60;
const ROCK = '#888880';
const ROCK2 = '#666660';
const ROCK3 = '#aaaaaa';

let parts = [];
let rockState = null; // { petX, petY, subT }
let fish = null; // { x, y, dir, active }
let lastTickAt = performance.now();

function addDrops(sx, sy) {
  for (let i = 0; i < 8; i += 1) {
    parts.push({
      type: 'water',
      x: sx,
      y: sy,
      vx: 2 + Math.random() * 4,
      vy: -1 + Math.random() * 2,
      life: 1,
      r: 2.5 + Math.random() * 3
    });
  }
}

function addInk(sx, sy) {
  for (let i = 0; i < 22; i += 1) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 6;
    parts.push({
      type: 'ink',
      x: sx,
      y: sy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 2,
      life: 1,
      r: 4 + Math.random() * 7
    });
  }
}

function addPopInk(sx, sy) {
  for (let i = 0; i < 12; i += 1) {
    const a = Math.random() * Math.PI * 2;
    const sp = 0.5 + Math.random() * 3;
    parts.push({
      type: 'ink',
      x: sx,
      y: sy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      life: 0.7,
      r: 2 + Math.random() * 4
    });
  }
}

function drawFish(x, y, dir, phase = 0) {
  const fw = 16;
  const fx2 = dir === 1 ? x : x - fw;
  const sy = Math.round((y ?? Math.floor(window.screen.height * 0.55)) + Math.sin(phase) * 2);

  cx.fillStyle = '#88ccff';
  cx.fillRect(fx2 + 3, sy + 2, 10, 6);

  cx.fillStyle = '#5599cc';
  if (dir === 1) {
    cx.fillRect(fx2, sy + 2, 4, 2);
    cx.fillRect(fx2, sy + 6, 4, 2);
  } else {
    cx.fillRect(fx2 + 12, sy + 2, 4, 2);
    cx.fillRect(fx2 + 12, sy + 6, 4, 2);
  }

  cx.fillStyle = '#000';
  if (dir === 1) cx.fillRect(fx2 + 11, sy + 4, 1, 1);
  else cx.fillRect(fx2 + 4, sy + 4, 1, 1);

  cx.fillStyle = '#66aadd';
  cx.fillRect(fx2 + 6, sy + 1, 4, 1);

  cx.fillStyle = 'rgba(255,255,255,0.5)';
  cx.fillRect(fx2 + 7, sy + 4, 1, 1);
}

ipcRenderer.on('fx-cmd', (_, cmd) => {
  if (cmd.type === 'fish') fish = { x: cmd.x, y: cmd.y, dir: cmd.dir, active: cmd.active };
  if (cmd.type === 'clearFish') fish = null;
  if (cmd.type === 'drops') addDrops(cmd.x, cmd.y);
  if (cmd.type === 'ink') addInk(cmd.x, cmd.y);
  if (cmd.type === 'popInk') addPopInk(cmd.x, cmd.y);
  if (cmd.type === 'rocks') rockState = { petX: cmd.petX, petY: cmd.petY, subT: cmd.subT };
  if (cmd.type === 'clearRocks') rockState = null;
});

function drawRocks(petX, petY, subT) {
  const placed = Math.min(3, Math.floor(subT / 60));
  const groundY = petY + 68;
  const baseX = petX + 88;
  const defs = [{ w: 14, h: 8 }, { w: 11, h: 7 }, { w: 9, h: 5 }];
  const cols = [[ROCK, ROCK2], [ROCK2, ROCK3], [ROCK3, ROCK]];
  let sh = 0;

  for (let i = 0; i < placed; i += 1) {
    const d = defs[i];
    const [c1, c2] = cols[i];
    const ry = groundY - sh - d.h;
    cx.fillStyle = c1;
    cx.fillRect(baseX, ry, d.w, d.h);
    cx.fillStyle = c2;
    cx.fillRect(baseX, ry, d.w, 2);
    cx.fillStyle = 'rgba(0,0,0,0.25)';
    cx.fillRect(baseX, ry + d.h - 2, d.w, 2);
    sh += d.h;
  }

  if (placed < 3) {
    const d = defs[placed];
    const [c1, c2] = cols[placed];
    const bob = Math.round(Math.sin(subT / 10) * 2);
    cx.fillStyle = c1;
    cx.fillRect(petX + 24, petY - 2 + bob, d.w, d.h);
    cx.fillStyle = c2;
    cx.fillRect(petX + 24, petY - 2 + bob, d.w, 2);
  }
}

function tick(now) {
  requestAnimationFrame(tick);

  const dtFrames = Math.max(0, now - lastTickAt) / FRAME_MS;
  lastTickAt = now;

  cx.clearRect(0, 0, c.width, c.height);

  if (rockState) {
    drawRocks(rockState.petX, rockState.petY, rockState.subT);
  }

  if (fish && fish.active) {
    drawFish(fish.x, fish.y, fish.dir, now / 140);
  }

  parts = parts.filter(d => d.life > 0);
  parts.forEach(d => {
    d.x += d.vx * dtFrames;
    d.y += d.vy * dtFrames;
    d.life -= (d.type === 'ink' ? 0.018 : 0.035) * dtFrames;

    if (d.type === 'water') {
      d.vy += 0.15 * dtFrames;
      cx.beginPath();
      cx.ellipse(d.x, d.y, d.r * 1.5, d.r, 0, 0, Math.PI * 2);
      cx.fillStyle = `rgba(136,204,255,${(d.life * 0.8).toFixed(2)})`;
      cx.fill();
    } else {
      d.r = Math.max(0.1, d.r * Math.pow(0.98, dtFrames));
      cx.beginPath();
      cx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(80,20,120,${(d.life * 0.65).toFixed(2)})`;
      cx.fill();
    }
  });
}

requestAnimationFrame(tick);
</script>
</body></html>
