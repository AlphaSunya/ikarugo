<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:120px; height:120px; background:transparent; overflow:hidden; user-select:none; }
#bub { position:absolute; top:0; left:0; width:120px; height:30px; pointer-events:none; z-index:4; }
#pet { position:absolute; top:30px; left:20px; width:80px; height:80px; image-rendering:pixelated; cursor:grab; z-index:2; }
#fx  { position:absolute; top:30px; left:20px; width:80px; height:80px; image-rendering:pixelated; pointer-events:none; z-index:3; }
</style>
</head><body>
<canvas id="bub" width="120" height="30"></canvas>
<canvas id="fx"  width="20" height="20"></canvas>
<canvas id="pet" width="20" height="20"></canvas>
<script src="renderer.js"></script>
</body></html>
